name: Rust

on:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Run cargo check
        run: cargo check

  tests:
    strategy:
      matrix:
        rust:
          - { version: stable, name: stable }

    runs-on: ubuntu-latest
    name: Tests (ubuntu-latest, ${{ matrix.rust.name }})
    needs: [check]
    env:
      RUSTFLAGS: -C target-cpu=generic
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install ${{ matrix.rust.name }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust.version }}

      - name: Cache planetary data
        uses: actions/cache@v3
        with:
          path: data/
          # This key never changes unless you manually update the suffix version string,
          # meaning your CI will pull these heavy files from the cache infinitely.
          key: planetary-data-v2.5.0

      - name: Set up cargo cache
        uses: actions/cache@v3
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Download model data
        shell: bash
        run: sh download_model_data.sh

      - name: Unit Test (debug)
        run: ls -lR data/ && cargo test --workspace --exclude nyx-py --lib

      - name: All integration tests (release)
        run: cargo test --workspace --exclude nyx-py --release --test "*"

      - name: Doc Test
        run: cargo test --workspace --exclude nyx-py --doc

      - name: Run examples
        run: |
          cd nyx-core
          cargo build --example 01_orbit_prop --release
          cargo build --example 02_jwst --release
          cargo build --example 03_geo_drift --release
          cargo build --example 03_geo_raise --release
          cargo build --example 03_geo_sk --release

  coverage:
    name: Coverage analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache planetary data
        uses: actions/cache@v3
        with:
          path: data/
          # This key never changes unless you manually update the suffix version string,
          # meaning your CI will pull these heavy files from the cache infinitely.
          key: planetary-data-v2.5.0

      - name: Set up cargo cache
        uses: actions/cache@v3
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Download model data
        shell: bash
        run: sh download_model_data.sh

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate full code coverage
        run: |
          cd nyx-core
          cargo llvm-cov test --release --lib --no-report
          cargo llvm-cov test --release --no-report
          cargo llvm-cov report --release --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          files: lcov.info
          fail_ci_if_error: false

  lints:
    name: Lints
    runs-on: ubuntu-latest
    needs: [tests]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [check, tests, lints]

    if: github.ref_type == 'tag'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Publish to crates.io
        env:
          TOKEN: ${{ secrets.CRATESIO_API_TOKEN }}
        run: |
          cargo login $TOKEN
          cd nyx-core && cargo publish
